name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate the Android platform folder
        run: flutter create --platforms=android --org com.habittracker --project-name habit_tracker .

      - name: Configure Android for reminders
        run: python3 scripts/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: Analyse
        continue-on-error: true
        run: flutter analyze

      - name: Build the APK
        run: flutter build apk --debug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
